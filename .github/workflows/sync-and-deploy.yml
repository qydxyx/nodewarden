name: Sync Upstream & Deploy

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/shuaiplus/nodewarden.git || true
          git fetch upstream main
          OLD_HASH=$(git rev-parse HEAD)
          git merge upstream/main -m "chore: sync upstream" || (echo "Merge conflict, manual resolution needed" && exit 1)
          NEW_HASH=$(git rev-parse HEAD)
          if [ "$OLD_HASH" != "$NEW_HASH" ]; then
            git push origin main
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.sync.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.sync.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Deploy to Cloudflare Workers (KV mode)
        if: steps.sync.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:kv
